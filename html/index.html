<!DOCTYPE html>
<!--
  ============================================================
  PANTALLA · REGISTRO
  ------------------------------------------------------------
  Primera pantalla del recorrido. Acá la participante se
  registra y queda identificada para el resto del evento.

  Acá la participante se da de alta con nombre y DNI. El
  formulario se valida en el cliente (ver js/paginas/registro.js)
  y el resultado se muestra en un modal de éxito o de error.

  ⚠️ CAMBIO DE REQUERIMIENTOS
  Antes la primera pantalla era la de activación (código de
  acreditación). Esa pantalla salió del flujo: ahora se entra
  directo por el registro. Si ves "activación" mencionada en
  algún lado del proyecto, es una referencia vieja.

  Este archivo es el punto de entrada real del proyecto:
    · el index.html de la raíz redirige acá
    · js/ui.js manda acá a quien no tenga pasaporte todavía
      (PUMM.UI.exigirRegistro)

  ⚠️ Esta pantalla NO lleva la barra de navegación: todavía no
  hay pasaporte que mostrar. La nav aparece recién después.

  ⚠️ js/paginas/registro.js NO llama a UI.exigirRegistro(): esta
  es la pantalla a la que esa función redirige, así que entraría
  en un bucle consigo misma.

  ⚠️ REGLA DE RUTAS EN ESTA CARPETA
  Este archivo vive en html/, así que para salir a css/, js/ o
  data/ hay que subir un nivel con ../
      ✅  ../css/main.css
      ❌  css/main.css      (busca html/css/, no existe)
      ❌  /css/main.css     (la barra inicial rompe en WordPress)
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasaporte Digital - PUMM 2026</title>
  <meta name="description" content="Tu recorrido por PUMM 2026.">
  <meta name="theme-color" content="#5B0099">

  <link rel="stylesheet" href="../css/main.css">
</head>

<body data-pagina="registro">

  <main class="registro">

    <div class="registro__card">

      <img class="registro__logo" src="../assets/img/logo-pumm.webp" alt="PUMM">

      <h1 class="registro__titulo">Pasaporte Digital</h1>

      <p class="registro__slogan">
        ¡No te pierdas este festival!
        <img class="registro__corazon" src="../assets/img/corazon-amarillo.webp"
             alt="" aria-hidden="true">
      </p>

      <!-- novalidate: apagamos los globos nativos del navegador para
           usar nuestros propios mensajes bajo cada campo (registro.js). -->
      <form id="form-registro" novalidate>

        <div class="registro__campo">
          <label class="campo__etiqueta" for="nombre">Nombre</label>
          <input class="campo" id="nombre" name="nombre" type="text"
                 placeholder="Tu nombre" autocomplete="given-name"
                 aria-describedby="ayuda-nombre">
          <p class="campo__ayuda" id="ayuda-nombre" aria-live="polite"></p>
        </div>

        <div class="registro__campo">
          <label class="campo__etiqueta" for="dni">DNI</label>
          <input class="campo" id="dni" name="dni" type="text"
                 inputmode="numeric" maxlength="8" placeholder="12345678"
                 autocomplete="off" aria-describedby="ayuda-dni">
          <p class="campo__ayuda" id="ayuda-dni" aria-live="polite"></p>
        </div>

        <button class="boton boton--primario boton--ancho" type="submit">
          Registrarme
          <img class="boton__icono" src="../assets/iconos/flecha-der-blanca.svg"
               alt="" aria-hidden="true">
        </button>

      </form>

      <p class="registro__nota">
        Utilizaremos estos datos para generar tu código de ingreso al evento.
      </p>

      <!-- Estrellas decorativas colgadas de la esquina inferior izquierda
           de la tarjeta. Van adentro de la tarjeta a propósito: así quedan
           siempre pegadas a su esquina, no a la del viewport. aria-hidden:
           no aportan información, no las lee un lector de pantalla. -->
      <img class="registro__estrellas" src="../assets/img/estrellas.webp"
           alt="" aria-hidden="true">

    </div>
  </main>

  <!-- Modal vacío. Lo rellena js/ui.js con PUMM.UI.abrirModal({...}).
       Lo vas a necesitar para los errores del formulario. -->
  <dialog class="modal" id="modal"></dialog>

  <!--
    ORDEN DE LOS SCRIPTS — importa y no es arbitrario:
      1. data/    los arrays de datos
      2. config   las constantes
      3. datos    la capa de acceso (necesita que config ya corrió)
      4. ui       los helpers (necesitan textos)
      5. app      lo común a todas las pantallas
      6. paginas/ la lógica de ESTA pantalla
    Si invertís 2 y 3, datos.js no encuentra CONFIG y todo rompe.
  -->
  <script src="../data/participantes.js"></script>
  <script src="../data/misiones.js"></script>
  <script src="../data/insignias.js"></script>
  <script src="../data/textos.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>

  <script src="../js/paginas/registro.js"></script>
</body>
</html>
