<!DOCTYPE html>
<!--
  ============================================================
  PANTALLA · MISIONES
  ------------------------------------------------------------
  Listado de misiones del recorrido con buscador y filtros
  (hora, ubicación, orden). Lo arma js/paginas/misiones.js con
  los datos de data/misiones.js.
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misiones - PUMM 2026</title>
  <link rel="icon" type="image/svg+xml" href="../assets/iconos/corazon-violeta.svg">
  <meta name="theme-color" content="#5B0099">
  <link rel="stylesheet" href="../css/main.css">
</head>

<body data-pagina="misiones">

  <!-- .contenedor centra y limita el ancho. .con-nav deja lugar
       abajo para que la barra fija no tape el último elemento. -->
  <main class="contenedor con-nav">

    <!-- Encabezado -->
    <header class="encabezado encabezado__misiones">
      <h1 class="encabezado__titulo-misiones">Misiones a explorar</h1>
    </header>

    <!-- Buscador -->
    <div class="campo-buscador">
      <svg class="campo-buscador__icono" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z" fill="#0F0F0F"/>
      </svg>
      <input
        type="search"
        id="buscador-misiones"
        class="campo campo--buscador"
        placeholder="Encuentra tu próxima aventura...">
    </div>

    <!-- Filtros -->
    <button type="button" class="boton boton--secundario boton--ancho" id="btn-filtros">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 12V10H11V12H7ZM3 7V5H15V7H3ZM0 2V0H18V2H0Z" fill="#0F0F0F"/>
      </svg>
      Filtros
    </button>

    <div class="panel-filtros oculto" id="panel-filtros">
      <label class="campo__etiqueta" for="filtro-hora">Empiezan después de</label>
      <input type="time" id="filtro-hora" class="campo">
      <label class="campo__etiqueta" for="filtro-zona">Ubicación</label>
      <select id="filtro-zona" class="campo">
        <option value="">Todas las ubicaciones</option>
        <!-- opciones generadas por JS -->
      </select>
      <label class="campo__etiqueta" for="filtro-orden">Ordenar</label>
      <select id="filtro-orden" class="campo">
        <option value="">Como vienen</option>
        <option value="alfabetico">Alfabético (A-Z)</option>
      </select>
    </div>

    <!-- Tarjetas -->
    <div class="pila" id="lista-misiones">
      <!-- tarjetas generadas por misiones.js -->
    </div>

    <!--
      NAVEGACIÓN — va DENTRO de <main> a propósito: el bundle solo
      conserva el <main> de cada pantalla, así que afuera se perdería.
      Como es position:fixed, su lugar en el DOM no cambia dónde se ve.
      ⚠️ Si cambiás algo acá, cambialo en todas las pantallas.
    -->
    <nav class="nav" aria-label="Secciones principales">
      <a class="nav__item" data-seccion="pasaporte" href="pasaporte.html">
        <img class="nav__icono" src="../assets/iconos/pasaporte-negro.svg" alt="Ícono de pasaporte">
        Pasaporte
      </a>
      <a class="nav__item nav__item--activo" data-seccion="misiones" href="misiones.html">
        <img class="nav__icono" src="../assets/iconos/misiones-blanco.svg" alt="Ícono de misiones">
        Misiones
      </a>
      <a class="nav__item" data-seccion="logros" href="logros.html">
        <img class="nav__icono" src="../assets/iconos/logros-negro.svg" alt="Ícono de logros">
        Logros
      </a>
    </nav>

  </main>

  <dialog class="modal" id="modal"></dialog>

  <script src="../data/misiones.js"></script>
  <script src="../data/logros.js"></script>
  <script src="../data/textos.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>

  <script src="../js/paginas/misiones.js"></script>
</body>
</html>
