<!DOCTYPE html>
<!--
  ============================================================
  PANTALLA · PASAPORTE (Mi Pasaporte)
  ------------------------------------------------------------
  Pantalla principal del recorrido: saludo, progreso (pista de
  misiones) y la misión destacada del momento. Reemplaza al
  placeholder de "dummy de verificación" que había antes.

  ⚙️ Mismos dos modos (local / bundle) que el resto del flujo.
  Ver la nota completa en html/index.html.

  ⚠️ Rutas: este archivo vive en html/, así que a css/, js/ y
  data/ se llega con ../
  ============================================================
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pasaporte - PUMM 2026</title>
  <meta name="theme-color" content="#5B0099">

  <link rel="icon" type="image/svg+xml" href="../assets/iconos/corazon-violeta.svg">

  <link rel="stylesheet" href="../css/main.css">
</head>

<body data-pagina="pasaporte">

  <!-- .fondo-blanco (css/base/utilidades.css) da el fondo a pantalla
       completa; va en el main para viajar con la vista en el bundle. -->
  <main class="fondo-blanco con-nav">

    <div class="contenedor">

      <header class="encabezado encabezado--pasaporte">

        <div class="encabezado-fila-1">
          <h1 class="encabezado__titulo" id="pasaporte-saludo"></h1>
          <img class="encabezado__celular" src="../assets/iconos/celular.svg" alt="Ícono de celular">
        </div>

        <div class="encabezado-fila-2">
          <img class="encabezado__corazon" src="../assets/iconos/corazon-violeta-2.svg" alt="Ícono de corazón">
          <p class="encabezado__bajada">¿Lista para tu próxima aventura?</p>
        </div>

      </header>

      <!-- Progreso del recorrido: misiones completadas (X/8) + barra. -->
      <section class="tarjeta pasaporte-progreso" aria-label="Tu progreso">
        <p class="pasaporte-progreso__etiqueta">
          MISIONES COMPLETADAS (<span id="progreso-fraccion">0/0</span>)
        </p>
        <div class="progreso__barra pasaporte-progreso__barra">
          <div class="progreso__relleno" id="progreso-relleno" style="width: 0%"></div>
        </div>

        <!-- Certificados: ocultos hasta cumplir su condición. Van a la
             pantalla de felicitaciones (completado.html). -->
        <div class="pila pasaporte-acciones" id="pasaporte-acciones">
          <a class="boton boton--secundario boton--ancho oculto" id="cert-participacion" href="completado.html">
            Certificado de participación
          </a>
          <a class="boton boton--primario boton--ancho oculto" id="cert-logros" href="completado.html">
            ¡Reclama tu premio!
          </a>
        </div>
      </section>

      <br>
      <div class="franja-ajedrez" aria-hidden="true"></div>
      <br>

      <!-- Llamado a escanear QR. -->
      <section>
        <div class="aviso-qr">
          <p class="aviso-qr__icono"><img src="../assets/iconos/qr-negro.svg" alt="Ícono de código QR"></p>
          <p class="aviso-qr__texto">
            ¡Buscá los QR y escanealos para completar misiones!
          </p>
          <img class="aviso-qr__rayo" src="../assets/iconos/rayo.svg" alt="Ícono de rayo">
        </div>
      </section>

      <!-- Actividad destacada + checklist de misiones. -->
      <section class="pasaporte-recuadro">
        <!-- Actividad destacada del momento (del cronograma). -->
        <article class="tarjeta tarjeta--mision" id="destacada-tarjeta">
          <div class="fila-entre">
            <h2 class="tarjeta__titulo" id="destacada-titulo"></h2>
            <span class="tarjeta__etiqueta">Destacado</span>
          </div>
          <!-- Categoría con su emoji, entre el título y la ubicación. -->
          <p class="destacada__categoria" id="destacada-categoria"></p>
          <p id="destacada-texto"></p>
          <p class="tarjeta__meta" id="destacada-lugar"></p>
        </article>

        <!-- Checklist de las misiones (la arma pintarMisiones). -->
        <h2 class="pasaporte-misiones__titulo">Tus misiones</h2>
        <ul class="pasaporte-misiones" id="pasaporte-misiones" aria-live="polite"></ul>
      </section>

    </div>

    <!--
      NAVEGACIÓN — va DENTRO del main a propósito (el bundle solo conserva
      el main de cada pantalla). Como es position:fixed, su lugar en el DOM
      no cambia dónde se ve.
    -->
    <nav class="nav" aria-label="Secciones principales">
      <a class="nav__item nav__item--activo" data-seccion="pasaporte" href="pasaporte.html">
        <img class="nav__icono" src="../assets/iconos/pasaporte-blanco.svg" alt="Ícono de pasaporte">
        Pasaporte
      </a>
      <a class="nav__item" data-seccion="actividades" href="actividades.html">
        <img class="nav__icono" src="../assets/iconos/misiones-negro.svg" alt="Ícono de actividades">
        Actividades
      </a>
      <a class="nav__item" data-seccion="logros" href="logros.html">
        <img class="nav__icono" src="../assets/iconos/logros-negro.svg" alt="Ícono de logros">
        Logros
      </a>
    </nav>

  </main>

  <!-- Modal vacío (lo usa PUMM.UI.abrirModal si hiciera falta). -->
  <dialog class="modal" id="modal"></dialog>

  <!-- Mismo orden de scripts que el resto de las pantallas. -->
  <script src="../data/misiones.js"></script>
  <script src="../data/actividades.js"></script>
  <script src="../data/logros.js"></script>
  <script src="../data/textos.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/app.js"></script>

  <script src="../js/paginas/pasaporte.js"></script>
</body>

</html>
